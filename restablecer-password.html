<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña - MS PC Gaming</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#050b18;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.contenedor{width:100%;max-width:480px;background:#111827;padding:30px;border-radius:15px;box-shadow:0 0 25px rgba(0,123,255,.25)}
.logo{display:block;width:180px;max-width:100%;margin:0 auto 20px}
h1{text-align:center;color:#007bff;margin-bottom:10px}
.descripcion{text-align:center;color:#d1d5db;margin-bottom:25px}
.campo{margin-bottom:16px;position:relative}
label{display:block;margin-bottom:7px;font-weight:bold}
input{width:100%;padding:13px;padding-right:48px;border:1px solid #374151;border-radius:8px;background:#1f2937;color:white;font-size:16px;outline:none}
input:focus{border-color:#007bff}
.ojo{position:absolute;right:9px;bottom:7px;width:36px;height:36px;border:none;background:transparent;color:#9ca3af;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;border-radius:6px}
.ojo:hover{color:#007bff;background:rgba(0,123,255,.08)}
.ojo svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.guardar{width:100%;padding:13px;border:0;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;background:#007bff;color:white}
.guardar:hover{background:#0056b3}
.guardar:disabled{opacity:.6;cursor:not-allowed}
.mensaje{text-align:center;margin-top:15px;font-weight:bold}
</style>

</head>

<body>

<div class="contenedor">

```
<img
    src="Multimedia web/Logo tienda/MSPC GAMING.PNG.png"

    class="logo"

<h1>Nueva contraseña</h1>

<p class="descripcion">
    Crea una nueva contraseña para tu cuenta de MS PC Gaming.
</p>


<div class="campo">

    <label for="nuevaPassword">
        Nueva contraseña
    </label>

    <input
        type="password"
        id="nuevaPassword"
        placeholder="Mínimo 8 caracteres"
        autocomplete="new-password"
    >

    <button
        type="button"
        class="ojo"
        aria-label="Mostrar contraseña"
        title="Mostrar contraseña"
        onclick="alternar('nuevaPassword',this)"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>

        </svg>

</div>


<div class="campo">

    <label for="confirmarPassword">
        Confirmar contraseña
    </label>

    <input
        type="password"
        id="confirmarPassword"
        placeholder="Repite la contraseña"
        autocomplete="new-password"
    >

    <button
        type="button"
        class="ojo"
        aria-label="Mostrar contraseña"
        title="Mostrar contraseña"
        onclick="alternar('confirmarPassword',this)"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="2.8"></circle>
        </svg>
    </button>

</div>


<button
    class="guardar"
    type="button"
    onclick="cambiarPassword()"
    disabled
>
    CAMBIAR CONTRASEÑA
</button>


<div
    id="mensaje"
    class="mensaje"

```

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://tqcoguvqoxvjohdzngqe.supabase.co";


/*
   MISMA CLAVE UTILIZADA EN registro.html
*/

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CyIQ-3xksclxNp2j-X2JAA_DUbdIMn_";


const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);


/* =========================
   ESTADO DE RECUPERACIÓN
========================= */

let sesionRecuperacionValida = false;


/* =========================
   MOSTRAR / OCULTAR PASSWORD
========================= */

function alternar(id, boton) {

    const input =
        document.getElementById(id);

    const visible =
        input.type === "password";

    input.type =
        visible ? "text" : "password";

    boton.setAttribute(
        "aria-label",
        visible
            ? "Ocultar contraseña"
            : "Mostrar contraseña"
    );

    boton.setAttribute(
        "title",
        visible
            ? "Ocultar contraseña"
            : "Mostrar contraseña"
    );

}


/* =========================
   MENSAJES
========================= */

function mensaje(texto, error) {

    const elemento =
        document.getElementById("mensaje");

    elemento.textContent = texto;

    elemento.style.color =
        error
            ? "#ff4d4d"
            : "#00d26a";

}


/* =========================
   ACTIVAR RECUPERACIÓN
========================= */

function activarRecuperacion() {

    sesionRecuperacionValida = true;

    document
        .querySelector(".guardar")
        .disabled = false;

    mensaje(
        "Puedes crear una nueva contraseña.",
        false
    );

}


/* =========================
   DETECTAR RECUPERACIÓN
========================= */

/*
   Este evento es el que identifica que
   Supabase abrió esta página desde un
   enlace de recuperación de contraseña.
*/

supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        console.log(
            "Supabase Auth:",
            event
        );


        if (
            event === "PASSWORD_RECOVERY" &&
            session
        ) {

            activarRecuperacion();

        }

    }
);


/* =========================
   COMPROBAR SESIÓN
========================= */

async function comprobarSesion() {

    /*
       Damos tiempo a Supabase para procesar
       el token incluido en el enlace recibido
       por correo.
    */

    await new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                500
            );

        }
    );


    /*
       Si ya detectamos PASSWORD_RECOVERY,
       no hacemos ninguna comprobación adicional.
    */

    if (
        sesionRecuperacionValida
    ) {
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    /*
       Si existe una sesión creada desde
       el enlace de recuperación, permitimos
       actualizar la contraseña.
    */

    if (
        !error &&
        data.session
    ) {

        activarRecuperacion();

        return;

    }


    /*
       Si no existe ninguna sesión,
       el enlace es inválido o expiró.
    */

    mensaje(
        "El enlace de recuperación no es válido o ya expiró. Solicita un nuevo enlace desde Iniciar sesión.",
        true
    );


    document
        .querySelector(".guardar")
        .disabled = true;

}


/* =========================
   CAMBIAR CONTRASEÑA
========================= */

async function cambiarPassword() {


    if (
        !sesionRecuperacionValida
    ) {

        mensaje(
            "El enlace de recuperación no es válido o ya expiró.",
            true
        );

        return;

    }


    const password =
        document
            .getElementById("nuevaPassword")
            .value;


    const confirmar =
        document
            .getElementById("confirmarPassword")
            .value;


    if (
        !password ||
        !confirmar
    ) {

        mensaje(
            "Completa ambos campos.",
            true
        );

        return;

    }


    if (
        password !== confirmar
    ) {

        mensaje(
            "Las contraseñas no coinciden.",
            true
        );

        return;

    }


    if (
        !/^(?=.*[A-Z])(?=.*\d).{8,}$/.test(password)
    ) {

        mensaje(
            "La contraseña debe tener mínimo 8 caracteres, una letra mayúscula y un número.",
            true
        );

        return;

    }


    mensaje(
        "Cambiando contraseña...",
        false
    );


    document
        .querySelector(".guardar")
        .disabled = true;


    const {
        error
    } =
        await supabaseClient.auth.updateUser({
            password: password
        });


    if (
        error
    ) {

        console.error(error);

        mensaje(
            "No se pudo cambiar la contraseña. Solicita un nuevo enlace e inténtalo otra vez.",
            true
        );


        document
            .querySelector(".guardar")
            .disabled = false;

        return;

    }


    mensaje(
        "¡Contraseña cambiada correctamente! Ya puedes iniciar sesión.",
        false
    );


    /*
       Cerramos la sesión temporal utilizada
       para recuperar la contraseña.
    */

    await supabaseClient.auth.signOut();


    setTimeout(
        function() {

            window.location.href =
                "registro.html";

        },
        1500
    );

}


/* =========================
   INICIAR
========================= */

comprobarSesion();

</script>

</body>
</html>
